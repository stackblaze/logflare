name: Docker Base Runner Daily Build

on:
  schedule:
    - cron: "0 2 * * *" # Daily at 2 AM UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  settings:
    runs-on: [self-hosted, us-east-1]
    outputs:
      short_sha: ${{steps.env.outputs.short_sha}}
    steps:
      - uses: actions/checkout@v6
      - name: Setup outputs
        id: env
        run: |
          echo "short_sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

  build_base:
    needs: settings
    runs-on: [self-hosted, us-east-1]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - run: docker context create builders
      - uses: docker/setup-buildx-action@v4
        with:
          endpoint: builders
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          file: ./Dockerfile.base
          push: true
          tags: |
            supabase/logflare:base-${{ needs.settings.outputs.short_sha }}-amd64
            supabase/logflare:base-amd64
          platforms: linux/amd64
          cache-from: type=gha,scope=base-amd64
          cache-to: type=gha,scope=base-amd64,mode=max

  build_runner:
    needs: settings
    runs-on: [self-hosted, us-east-1]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - run: docker context create builders
      - uses: docker/setup-buildx-action@v4
        with:
          endpoint: builders
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          file: ./Dockerfile.runner
          push: true
          tags: |
            supabase/logflare:runner-${{ needs.settings.outputs.short_sha }}-amd64
            supabase/logflare:runner-amd64
          platforms: linux/amd64
          cache-from: type=gha,scope=runner-amd64
          cache-to: type=gha,scope=runner-amd64,mode=max

  merge_publish:
    needs:
      - settings
      - build_base
      - build_runner
    runs-on: [self-hosted, us-east-1]
    steps:
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Retag base image
        run: |
          docker buildx imagetools create -t supabase/logflare:base \
          supabase/logflare:base-amd64
      - name: Retag runner image
        run: |
          docker buildx imagetools create -t supabase/logflare:runner \
          supabase/logflare:runner-amd64
