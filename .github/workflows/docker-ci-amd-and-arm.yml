name: Docker CI Multi-Platform

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  settings:
    runs-on: [self-hosted, us-east-1]
    outputs:
      version: ${{steps.env.outputs.version}}
      short_sha: ${{steps.env.outputs.short_sha}}
    steps:
      - uses: actions/checkout@v6
      - name: Setup outputs
        id: env
        run: |
          echo "version=$(cat ./VERSION)" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
  build:
    needs: settings
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
      cancel-in-progress: ${{ github.event_name == 'push' }}
    runs-on: [self-hosted, us-east-1]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      # Setup docker
      # https://github.com/supabase/postgres/blob/develop/.github/workflows/dockerhub-release.yml#LL41C11-L42C44
      - run: docker context create builders
      - uses: docker/setup-buildx-action@v4
        with:
          endpoint: builders
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # Build and push
      - id: build
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: supabase/logflare:dev-${{ needs.settings.outputs.short_sha }}-amd64
          platforms: linux/amd64
          # Baked into the image as LOGFLARE_COMMIT_SHA and emitted as an OTel
          # resource attribute at runtime (see Dockerfile / Logflare.Telemetry).
          build-args: |
            COMMIT_SHA=${{ needs.settings.outputs.short_sha }}
          cache-from: type=gha,scope=app-amd64
          cache-to: type=gha,scope=app-amd64,mode=max

  merge_publish:
    needs:
      - settings
      - build
    runs-on: [self-hosted, us-east-1]
    steps:
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Setup tags
        run: |
          echo "tag_amd64=supabase/logflare:dev-${{ needs.settings.outputs.short_sha }}-amd64" >> "$GITHUB_ENV"
          echo "tag_sha=supabase/logflare:dev-${{ needs.settings.outputs.short_sha }}" >> "$GITHUB_ENV"
      - name: Staging - Retag the amd64 image as the dev image
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          docker buildx imagetools create -t ${{ env.tag_sha }} \
          ${{ env.tag_amd64 }}

  trigger_cloudbuild:
    uses: ./.github/workflows/trigger-cloudbuild.yml
    needs:
      - settings
      - build
      - merge_publish
    secrets: inherit